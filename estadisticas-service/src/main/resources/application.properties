spring.application.name=estadisticas-service
server.port=${SERVER_PORT:8082}

# Base de datos propia de estadisticas-service (no compartida con torneo-service)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/estadisticas_db}
spring.datasource.username=${DB_USER:estadisticas}
spring.datasource.password=${DB_PASSWORD:estadisticas}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Contrato de eventos (debe coincidir con torneo-service)
torneo.eventos.exchange=torneo.eventos
torneo.eventos.partido-finalizado.routing-key=partido.finalizado
estadisticas.colas.partido-finalizado=estadisticas.partido-finalizado
