spring.application.name=torneo-service
server.port=${SERVER_PORT:8081}

# Base de datos propia de torneo-service (no compartida con estadisticas-service)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/torneo_db}
spring.datasource.username=${DB_USER:torneo}
spring.datasource.password=${DB_PASSWORD:torneo}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

# Contrato de eventos (debe coincidir con estadisticas-service)
torneo.eventos.exchange=torneo.eventos
torneo.eventos.partido-finalizado.routing-key=partido.finalizado
